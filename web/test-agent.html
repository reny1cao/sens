<!DOCTYPE html>
<html>
<head>
    <title>Test Agent Endpoints</title>
</head>
<body>
    <h1>Agent Endpoint Tests</h1>
    <button onclick="testQuery()">Test Query Endpoint</button>
    <button onclick="testSuggestions()">Test Suggestions</button>
    <div id="results"></div>

    <script>
        const API_URL = 'https://sens-aautwtble-reny1caos-projects.vercel.app';
        
        async function testQuery() {
            const results = document.getElementById('results');
            results.innerHTML = 'Testing query endpoint...';
            
            try {
                const response = await fetch(`${API_URL}/api/nl2sql/agent/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: 'Show me all products',
                        max_iterations: 10
                    })
                });
                
                const data = await response.text();
                results.innerHTML = `<pre>Status: ${response.status}\nHeaders: ${JSON.stringify(Object.fromEntries(response.headers))}\n${data}</pre>`;
            } catch (error) {
                results.innerHTML = `<pre>Error: ${error.message}</pre>`;
            }
        }
        
        async function testSuggestions() {
            const results = document.getElementById('results');
            results.innerHTML = 'Testing suggestions endpoint...';
            
            try {
                const response = await fetch(`${API_URL}/api/datasource/suggestions`);
                const data = await response.text();
                results.innerHTML = `<pre>Status: ${response.status}\nHeaders: ${JSON.stringify(Object.fromEntries(response.headers))}\n${data}</pre>`;
            } catch (error) {
                results.innerHTML = `<pre>Error: ${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
