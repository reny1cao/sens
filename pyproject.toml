[tool.poetry]
name = "sens"
version = "0.1.0"
description = "Semantic Natural SQL - Natural language to SQL conversion with LLMs"
authors = ["renyicao <renyi.cao@qq.com>"]
readme = "README.md"
packages = [{include = "sens", from = "src"}]

[tool.poetry.scripts]
sens = "sens.cli.main:main"

[tool.poetry.dependencies]
python = "^3.12"
psycopg2 = "^2.9.10"
fastapi = "^0.115.12"
uvicorn = "^0.34.2"
openai = "^1.76.0"
pydantic = "^2.6.4"
sentence-transformers = "^2.5.1"
faiss-cpu = "^1.8.0"
numpy = "^1.26.4"
torch = "2.2.1"
structlog = "^25.3.0"
pydantic-settings = "^2.1.0"
jinja2 = "^3.1.3"
sqlparse = "^0.4.4"  # For SQL validation and formatting
httpx = "^0.26.0"    # For async HTTP client
python-dotenv = "^1.1.0"
psycopg2-binary = "^2.9.9"  # PostgreSQL database adapter
tabulate = "^0.9.0"
sqlglot = "^26.17.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
pre-commit = "^4.2.0"
pytest-cov = "^6.1.1"
pytest-asyncio = "^0.26.0"
fastapi-cli = "^0.0.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D205",  # 1 blank line required between summary line and description
    "D401"   # First line should be in imperative mood
]
docstring-convention = "google"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "timeout: marks tests with timeout constraints"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=sens --cov-report=term-missing"
asyncio_mode = "auto"
